services:
  - type: web
    name: webdev-pathwise
    runtime: node
    plan: free
    rootDir: pathwise
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/session
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
